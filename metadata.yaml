  "abstract": "We independently implemented the Plymouth ozone and Brest sea-surge applications of Simpson and Northrop (2026). Missingness adjustment changes the fitted 100-year return level more in Plymouth than in Brest: with all available years, adjusted versus naive estimates are 215.48 versus 192.21 μg/m³ and 104.49 versus 104.20 cm, respectively. Our primary calculations meet the frozen printed-value tolerances for 113 of 120 scalar comparisons, including all 48 published interval endpoints. Seven other values narrowly exceed those tolerances; a separate fixed reference-optimizer calculation explains their sensitivity to stopping behavior without replacing the primary results. This is a partial empirical replication, not a new method or a replication of the original simulation study.",
